name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift (macOS + iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build and test on macOS
        run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme ChordDiagram -destination "generic/platform=iOS Simulator"

  js:
    name: React + React Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated files are up to date
        run: npm run check
      - run: npm run test:js
      - run: npm run typecheck:js
      - run: npm run build:js

  kotlin:
    name: Kotlin + Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Screenshot references were recorded on Windows; font rasterization differs on Linux, so they are not validated here.
      - name: Test and build
        working-directory: kotlin
        run: ./gradlew :chord-diagram-core:test :chord-diagram-compose:assembleRelease :sample:assembleDebug
